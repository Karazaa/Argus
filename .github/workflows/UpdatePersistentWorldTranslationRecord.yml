name: Update Persistent World Translation Record

on:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  run-commandlet:
    runs-on: self-hosted
    steps:
      - name: Running UpdatePersistentWorldTranslationRecordCommandlet Commandlet
        shell: powershell
        run: |
          $command = "& `"${{ secrets.PATH_TO_EDITOR_CMD }}`" `"${{ secrets.PATH_TO_UPROJECT }}`" -run=UpdatePersistentWorldTranslationRecordCommandlet -Unattended -NoLogTimes"
          Invoke-Expression $command
  git-add:
    runs-on: self-hosted
    needs:
      - run-commandlet
    steps:
      - name: Git add all
        shell: powershell
        run:  git -C ${{ secrets.PATH_TO_REPO }} add .

  git-commit:
    runs-on: self-hosted
    needs:
      - git-add
    steps:
      - name: Git commit
        shell: powershell
        run: |
          git -C ${{ secrets.PATH_TO_REPO }} commit -m "[AUTOMATED] Updating autogenerated data on Persistent World Translation Record."
          if ($LASTEXITCODE -eq 1) {
            $global:LASTEXITCODE = 0
          }
  git-push:
    runs-on: self-hosted
    needs:
      - git-commit
    steps:
      - name: Git push
        shell: powershell
        run: |
          git -C ${{ secrets.PATH_TO_REPO }} push
          if ($LASTEXITCODE -eq 1) {
            $global:LASTEXITCODE = 0
          }
